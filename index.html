<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Face</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #fff;
        }

        #webcam {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.5s ease;
            transform: scaleX(-1);
            z-index: 0;
        }

        #webcam.visible {
            opacity: 0.15;
        }

        #sampler { display: none; }

        canvas.main-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #mode-display {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.6;
            z-index: 2;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        #status {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            letter-spacing: 2px;
            opacity: 0.4;
            z-index: 2;
            pointer-events: none;
        }

        #controls {
            position: fixed;
            bottom: 24px;
            right: 24px;
            font-size: 11px;
            opacity: 0.3;
            z-index: 2;
            text-align: right;
            line-height: 1.8;
            pointer-events: none;
        }

        #mode-buttons {
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .mode-btn {
            width: 36px;
            height: 36px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.5);
            border-radius: 50%;
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: all;
            transition: all 0.3s ease;
        }

        .mode-btn:hover {
            border-color: rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .mode-btn.active {
            border-color: rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.15);
            color: #fff;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            background: #000;
            transition: opacity 1s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading h1 {
            font-size: 24px;
            letter-spacing: 8px;
            text-transform: uppercase;
            font-weight: 300;
            margin-bottom: 16px;
        }

        #loading p {
            font-size: 12px;
            letter-spacing: 2px;
            opacity: 0.5;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: rgba(255,255,255,0.6);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <h1>Particle Face</h1>
        <p>Initializing face tracking...</p>
    </div>

    <video id="webcam" autoplay playsinline></video>
    <canvas id="sampler"></canvas>

    <div id="mode-display">Form</div>
    <div id="status">Searching for face...</div>

    <div id="mode-buttons">
        <button class="mode-btn active" data-mode="0" title="Form">1</button>
        <button class="mode-btn" data-mode="1" title="Constellation">2</button>
        <button class="mode-btn" data-mode="2" title="Nebula">3</button>
        <button class="mode-btn" data-mode="3" title="Pulse">4</button>
        <button class="mode-btn" data-mode="4" title="Vortex">5</button>
    </div>

    <div id="controls">
        [1-5] Modes &middot; [V] Video &middot; [R] Rotate
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

    <script>
    // ============================================
    // Configuration
    // ============================================
    const CONFIG = {
        PARTICLE_COUNT: 3000,
        LANDMARK_COUNT: 468,
        FACE_SCALE: 5,
        FACE_DEPTH_SCALE: 2.5,
        COLOR_LERP_SPEED: 0.04,
        AMBIENT_PARTICLES: 200,
        PARTICLE_SIZE_BASE: 10,
        PARTICLE_SIZE_VARIANCE: 6,
    };

    const MODES = [
        { name: 'Form',          offsetScale: 0.06, springForce: 0.06, damping: 0.88 },
        { name: 'Constellation', offsetScale: 0.04, springForce: 0.07, damping: 0.86 },
        { name: 'Nebula',        offsetScale: 0.30, springForce: 0.03, damping: 0.92 },
        { name: 'Pulse',         offsetScale: 0.06, springForce: 0.06, damping: 0.88 },
        { name: 'Vortex',        offsetScale: 0.15, springForce: 0.05, damping: 0.90 },
    ];

    // Face contour landmark indices for constellation lines
    const FACE_CONTOURS = {
        faceOval: [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109,10],
        leftEye: [33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246,33],
        rightEye: [362,382,381,380,374,373,390,249,263,466,388,387,386,385,384,398,362],
        lipsOuter: [61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185,61],
        lipsInner: [78,95,88,178,87,14,317,402,318,324,308,415,310,311,312,13,82,81,80,191,78],
        leftEyebrow: [46,53,52,65,55,107,66,105,63,70],
        rightEyebrow: [276,283,282,295,285,336,296,334,293,300],
        noseBridge: [168,6,197,195,5,4,1,19],
    };

    // ============================================
    // State
    // ============================================
    const state = {
        currentMode: 0,
        faceDetected: false,
        landmarks: null,
        imageData: null,
        showVideo: false,
        autoRotate: false,
        rotationX: 0,
        rotationY: 0,
        mouseDown: false,
    };

    // ============================================
    // Three.js Setup
    // ============================================
    let scene, camera, renderer, clock;
    let particleSystem, particleGeometry, particleMaterial;
    let constellationLines, constellationGeometry;
    let positions, targetPositions, velocities;
    let particleColors, targetColors;
    let sizes, alphas, phases, landmarkAssignments, offsets;

    // Custom shaders for soft glowing circular particles
    const vertexShader = `
        attribute float aSize;
        attribute float aAlpha;
        attribute float aPhase;
        attribute vec3 aColor;
        varying vec3 vColor;
        varying float vAlpha;
        uniform float uTime;

        void main() {
            vColor = aColor;
            vAlpha = aAlpha;

            float pulse = 1.0 + sin(uTime * 2.0 + aPhase) * 0.1;

            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = aSize * pulse * (200.0 / -mvPosition.z);
            gl_PointSize = max(gl_PointSize, 1.0);
            gl_Position = projectionMatrix * mvPosition;
        }
    `;

    const fragmentShader = `
        varying vec3 vColor;
        varying float vAlpha;

        void main() {
            vec2 uv = gl_PointCoord - vec2(0.5);
            float dist = length(uv);

            if (dist > 0.5) discard;

            // Soft circular particle with glowing edge falloff
            float alpha = smoothstep(0.5, 0.1, dist) * vAlpha;

            // Bright core
            float core = exp(-dist * 10.0) * 0.4;

            vec3 finalColor = vColor + vec3(core);
            gl_FragColor = vec4(finalColor, alpha);
        }
    `;

    function initScene() {
        scene = new THREE.Scene();
        clock = new THREE.Clock();

        camera = new THREE.PerspectiveCamera(
            50,
            window.innerWidth / window.innerHeight,
            0.1,
            100
        );
        camera.position.z = 6;

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x000000, 1);
        renderer.domElement.classList.add('main-canvas');
        document.body.appendChild(renderer.domElement);
    }

    // ============================================
    // Particle System
    // ============================================
    function initParticles() {
        const count = CONFIG.PARTICLE_COUNT;

        positions = new Float32Array(count * 3);
        particleColors = new Float32Array(count * 3);
        targetPositions = new Float32Array(count * 3);
        targetColors = new Float32Array(count * 3);
        velocities = new Float32Array(count * 3);
        sizes = new Float32Array(count);
        alphas = new Float32Array(count);
        phases = new Float32Array(count);
        landmarkAssignments = new Int32Array(count);
        offsets = new Float32Array(count * 3);

        for (let i = 0; i < count; i++) {
            const i3 = i * 3;

            // Galaxy spiral initial positions
            const arm = Math.floor(Math.random() * 3);
            const armAngle = (arm / 3) * Math.PI * 2;
            const r = Math.pow(Math.random(), 0.5) * 5;
            const angle = r * 1.5 + armAngle + (Math.random() - 0.5) * 0.5;

            positions[i3]     = Math.cos(angle) * r;
            positions[i3 + 1] = (Math.random() - 0.5) * 0.8;
            positions[i3 + 2] = Math.sin(angle) * r;

            // Default cool blue/purple palette
            const hue = 0.6 + Math.random() * 0.2;
            const col = new THREE.Color().setHSL(hue, 0.8, 0.4 + Math.random() * 0.3);
            particleColors[i3]     = col.r;
            particleColors[i3 + 1] = col.g;
            particleColors[i3 + 2] = col.b;

            targetPositions[i3]     = positions[i3];
            targetPositions[i3 + 1] = positions[i3 + 1];
            targetPositions[i3 + 2] = positions[i3 + 2];

            targetColors[i3]     = particleColors[i3];
            targetColors[i3 + 1] = particleColors[i3 + 1];
            targetColors[i3 + 2] = particleColors[i3 + 2];

            velocities[i3] = 0;
            velocities[i3 + 1] = 0;
            velocities[i3 + 2] = 0;

            // Assign particles to face landmarks (cycle), last batch is ambient
            if (i < count - CONFIG.AMBIENT_PARTICLES) {
                landmarkAssignments[i] = i % CONFIG.LANDMARK_COUNT;
            } else {
                landmarkAssignments[i] = -1;
            }

            // Cluster offsets (normalized direction, scaled by mode)
            offsets[i3]     = (Math.random() - 0.5) * 2;
            offsets[i3 + 1] = (Math.random() - 0.5) * 2;
            offsets[i3 + 2] = (Math.random() - 0.5) * 2;

            sizes[i] = CONFIG.PARTICLE_SIZE_BASE + Math.random() * CONFIG.PARTICLE_SIZE_VARIANCE;
            alphas[i] = 0.4 + Math.random() * 0.6;
            phases[i] = Math.random() * Math.PI * 2;
        }

        particleGeometry = new THREE.BufferGeometry();
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeometry.setAttribute('aColor', new THREE.BufferAttribute(particleColors, 3));
        particleGeometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
        particleGeometry.setAttribute('aAlpha', new THREE.BufferAttribute(alphas, 1));
        particleGeometry.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));

        particleMaterial = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                uTime: { value: 0 },
            },
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });

        particleSystem = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particleSystem);

        initConstellationLines();
    }

    // ============================================
    // Constellation Lines
    // ============================================
    function initConstellationLines() {
        let segmentCount = 0;
        for (const contour of Object.values(FACE_CONTOURS)) {
            segmentCount += contour.length - 1;
        }

        const linePositions = new Float32Array(segmentCount * 2 * 3);

        constellationGeometry = new THREE.BufferGeometry();
        constellationGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));

        const lineMaterial = new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.12,
            blending: THREE.AdditiveBlending,
        });

        constellationLines = new THREE.LineSegments(constellationGeometry, lineMaterial);
        constellationLines.visible = false;
        scene.add(constellationLines);
    }

    function updateConstellationLines(landmarks) {
        if (!landmarks) return;

        const arr = constellationGeometry.attributes.position.array;
        let idx = 0;

        for (const contour of Object.values(FACE_CONTOURS)) {
            for (let i = 0; i < contour.length - 1; i++) {
                const la = landmarks[contour[i]];
                const lb = landmarks[contour[i + 1]];

                if (la && lb) {
                    arr[idx++] = (la.x - 0.5) * -CONFIG.FACE_SCALE;
                    arr[idx++] = (la.y - 0.5) * -CONFIG.FACE_SCALE;
                    arr[idx++] = la.z * -CONFIG.FACE_DEPTH_SCALE;

                    arr[idx++] = (lb.x - 0.5) * -CONFIG.FACE_SCALE;
                    arr[idx++] = (lb.y - 0.5) * -CONFIG.FACE_SCALE;
                    arr[idx++] = lb.z * -CONFIG.FACE_DEPTH_SCALE;
                }
            }
        }

        constellationGeometry.attributes.position.needsUpdate = true;
    }

    // ============================================
    // Face Mesh
    // ============================================
    let samplerCanvas, samplerCtx;

    function initFaceMesh() {
        const video = document.getElementById('webcam');
        samplerCanvas = document.getElementById('sampler');
        samplerCtx = samplerCanvas.getContext('2d', { willReadFrequently: true });

        const faceMesh = new FaceMesh({
            locateFile: (file) =>
                `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`,
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5,
        });

        faceMesh.onResults(onFaceResults);

        const mpCamera = new Camera(video, {
            onFrame: async () => {
                await faceMesh.send({ image: video });
            },
            width: 640,
            height: 480,
        });

        mpCamera.start().then(() => {
            samplerCanvas.width = 640;
            samplerCanvas.height = 480;
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 800);
        }).catch((err) => {
            const loading = document.getElementById('loading');
            loading.innerHTML = `
                <h1 style="font-size:20px;letter-spacing:6px;font-weight:300;text-transform:uppercase;">Camera Access Required</h1>
                <p style="font-size:12px;letter-spacing:2px;opacity:0.5;margin-top:12px;">Please allow camera access and reload the page.</p>
                <p style="font-size:10px;opacity:0.25;margin-top:8px;">${err.message || err}</p>
            `;
        });
    }

    function onFaceResults(results) {
        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
            state.faceDetected = true;
            state.landmarks = results.multiFaceLandmarks[0];

            // Sample colors from the current video frame
            const video = document.getElementById('webcam');
            samplerCtx.drawImage(video, 0, 0, samplerCanvas.width, samplerCanvas.height);
            state.imageData = samplerCtx.getImageData(0, 0, samplerCanvas.width, samplerCanvas.height);

            document.getElementById('status').textContent = 'Face detected';
        } else {
            state.faceDetected = false;
            state.landmarks = null;
            state.imageData = null;
            document.getElementById('status').textContent = 'Searching for face...';
        }
    }

    // ============================================
    // Target Updates
    // ============================================
    function updateTargets(landmarks, imageData) {
        const mode = MODES[state.currentMode];
        const time = clock.getElapsedTime();
        const count = CONFIG.PARTICLE_COUNT;
        const os = mode.offsetScale;

        for (let i = 0; i < count; i++) {
            const i3 = i * 3;
            const lmIdx = landmarkAssignments[i];

            // Ambient particles orbit the face
            if (lmIdx === -1) {
                const angle = time * 0.3 + phases[i];
                const radius = 3 + Math.sin(phases[i] * 3) * 1.5;
                targetPositions[i3]     = Math.cos(angle) * radius;
                targetPositions[i3 + 1] = Math.sin(angle * 0.7) * radius * 0.5;
                targetPositions[i3 + 2] = Math.sin(angle) * radius;

                targetColors[i3]     = 0.15;
                targetColors[i3 + 1] = 0.1;
                targetColors[i3 + 2] = 0.35;
                continue;
            }

            const lm = landmarks[lmIdx];
            if (!lm) continue;

            // Map face landmark to world space (mirror X, flip Y)
            let wx = (lm.x - 0.5) * -CONFIG.FACE_SCALE;
            let wy = (lm.y - 0.5) * -CONFIG.FACE_SCALE;
            let wz = lm.z * -CONFIG.FACE_DEPTH_SCALE;

            // Mode-specific target modifiers
            if (state.currentMode === 4) {
                // Vortex: orbit around landmark
                const va = time * 3 + phases[i];
                const vr = os * (1 + Math.sin(phases[i] * 5) * 0.5);
                wx += Math.cos(va) * vr * offsets[i3];
                wy += Math.sin(va) * vr * offsets[i3 + 1];
                wz += Math.sin(va * 0.5) * vr * offsets[i3 + 2];
            } else if (state.currentMode === 3) {
                // Pulse: breathing expansion
                const pulseScale = 1 + Math.sin(time * 2) * 0.15;
                wx *= pulseScale;
                wy *= pulseScale;
                wz *= pulseScale;
                wx += offsets[i3] * os;
                wy += offsets[i3 + 1] * os;
                wz += offsets[i3 + 2] * os;
            } else {
                // Standard cluster offset
                wx += offsets[i3] * os;
                wy += offsets[i3 + 1] * os;
                wz += offsets[i3 + 2] * os;
            }

            targetPositions[i3]     = wx;
            targetPositions[i3 + 1] = wy;
            targetPositions[i3 + 2] = wz;

            // Sample pixel color from webcam at landmark position
            if (imageData) {
                const px = Math.min(Math.max(Math.floor(lm.x * samplerCanvas.width), 0), samplerCanvas.width - 1);
                const py = Math.min(Math.max(Math.floor(lm.y * samplerCanvas.height), 0), samplerCanvas.height - 1);
                const pixIdx = (py * samplerCanvas.width + px) * 4;

                const boost = 1.3;
                targetColors[i3]     = Math.min(imageData.data[pixIdx]     / 255 * boost, 1);
                targetColors[i3 + 1] = Math.min(imageData.data[pixIdx + 1] / 255 * boost, 1);
                targetColors[i3 + 2] = Math.min(imageData.data[pixIdx + 2] / 255 * boost, 1);
            }
        }

        // Constellation lines update
        if (state.currentMode === 1) {
            updateConstellationLines(landmarks);
        }
    }

    function scatterParticles() {
        const count = CONFIG.PARTICLE_COUNT;
        const time = clock.getElapsedTime();

        for (let i = 0; i < count; i++) {
            const i3 = i * 3;

            const angle = time * 0.2 + phases[i] * Math.PI * 2;
            const r = 2 + Math.sin(phases[i] * 7) * 3;

            targetPositions[i3]     = Math.cos(angle) * r;
            targetPositions[i3 + 1] = Math.sin(phases[i] * 13) * 1.5;
            targetPositions[i3 + 2] = Math.sin(angle) * r;

            // Cool blue/purple scattered palette
            const hue = 0.6 + Math.sin(phases[i] * 5) * 0.15;
            const col = new THREE.Color().setHSL(hue, 0.7, 0.35);
            targetColors[i3]     = col.r;
            targetColors[i3 + 1] = col.g;
            targetColors[i3 + 2] = col.b;
        }
    }

    // ============================================
    // Physics Simulation
    // ============================================
    function updateParticles() {
        const mode = MODES[state.currentMode];
        const sf = mode.springForce;
        const damp = mode.damping;
        const cLerp = CONFIG.COLOR_LERP_SPEED;
        const count = CONFIG.PARTICLE_COUNT;

        for (let i = 0; i < count; i++) {
            const i3 = i * 3;

            // Spring toward target
            velocities[i3]     += (targetPositions[i3]     - positions[i3])     * sf;
            velocities[i3 + 1] += (targetPositions[i3 + 1] - positions[i3 + 1]) * sf;
            velocities[i3 + 2] += (targetPositions[i3 + 2] - positions[i3 + 2]) * sf;

            velocities[i3]     *= damp;
            velocities[i3 + 1] *= damp;
            velocities[i3 + 2] *= damp;

            positions[i3]     += velocities[i3];
            positions[i3 + 1] += velocities[i3 + 1];
            positions[i3 + 2] += velocities[i3 + 2];

            // Smooth color transition
            particleColors[i3]     += (targetColors[i3]     - particleColors[i3])     * cLerp;
            particleColors[i3 + 1] += (targetColors[i3 + 1] - particleColors[i3 + 1]) * cLerp;
            particleColors[i3 + 2] += (targetColors[i3 + 2] - particleColors[i3 + 2]) * cLerp;
        }

        particleGeometry.attributes.position.needsUpdate = true;
        particleGeometry.attributes.aColor.needsUpdate = true;
    }

    // ============================================
    // Mode Switching
    // ============================================
    function setMode(modeIndex) {
        if (modeIndex < 0 || modeIndex >= MODES.length) return;
        state.currentMode = modeIndex;

        document.getElementById('mode-display').textContent = MODES[modeIndex].name;

        constellationLines.visible = (modeIndex === 1);

        document.querySelectorAll('.mode-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx === modeIndex);
        });
    }

    // ============================================
    // Controls
    // ============================================
    function initControls() {
        document.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '5') {
                setMode(parseInt(e.key) - 1);
            } else if (e.key.toLowerCase() === 'v') {
                state.showVideo = !state.showVideo;
                document.getElementById('webcam').classList.toggle('visible', state.showVideo);
                renderer.setClearColor(0x000000, state.showVideo ? 0 : 1);
            } else if (e.key.toLowerCase() === 'r') {
                state.autoRotate = !state.autoRotate;
            }
        });

        document.querySelectorAll('.mode-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                setMode(parseInt(btn.dataset.mode));
            });
        });

        // Mouse drag rotation
        renderer.domElement.addEventListener('mousedown', (e) => {
            if (e.button === 0) state.mouseDown = true;
        });
        document.addEventListener('mouseup', () => { state.mouseDown = false; });
        document.addEventListener('mousemove', (e) => {
            if (state.mouseDown) {
                state.rotationY += e.movementX * 0.005;
                state.rotationX += e.movementY * 0.005;
                state.rotationX = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, state.rotationX));
            }
        });

        // Touch drag rotation
        let lastTouch = null;
        renderer.domElement.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });
        renderer.domElement.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && lastTouch) {
                const dx = e.touches[0].clientX - lastTouch.x;
                const dy = e.touches[0].clientY - lastTouch.y;
                state.rotationY += dx * 0.005;
                state.rotationX += dy * 0.005;
                state.rotationX = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, state.rotationX));
                lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });
        renderer.domElement.addEventListener('touchend', () => { lastTouch = null; });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    // ============================================
    // Render Loop
    // ============================================
    function animate() {
        requestAnimationFrame(animate);

        const time = clock.getElapsedTime();
        particleMaterial.uniforms.uTime.value = time;

        // Update targets from face state
        if (state.faceDetected && state.landmarks) {
            updateTargets(state.landmarks, state.imageData);
        } else {
            scatterParticles();
        }

        updateParticles();

        // Auto-rotate
        if (state.autoRotate) {
            state.rotationY += clock.getDelta() * 0.3 || 0.005;
        }

        // Slow return to center when idle
        if (!state.mouseDown && !state.autoRotate) {
            state.rotationX *= 0.98;
            state.rotationY *= 0.98;
        }

        // Smooth rotation interpolation
        particleSystem.rotation.x += (state.rotationX - particleSystem.rotation.x) * 0.1;
        particleSystem.rotation.y += (state.rotationY - particleSystem.rotation.y) * 0.1;
        constellationLines.rotation.copy(particleSystem.rotation);

        renderer.render(scene, camera);
    }

    // ============================================
    // Init
    // ============================================
    function main() {
        initScene();
        initParticles();
        initControls();
        initFaceMesh();
        animate();
    }

    main();
    </script>
</body>
